version: 2

updates:
  # Python dependencies declared in pyproject.toml (runtime + `cpu` and `dev` extras).
  # NOTE: requirements*.txt are generated with pip-tools; regenerate them on every
  # Dependabot PR (see CONTRIBUTING.md). The docker ecosystem is intentionally not
  # enabled: the base images are coupled to apt packages and the CUDA/OpenCV build.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Ask for direct dependencies only: transitive pins in the generated requirements*.txt
    # must be re-resolved together by pip-compile. Dependabot still bumps some of them
    # (see `ignore` below), so regenerate the files on every PR (CONTRIBUTING.md).
    allow:
      - dependency-type: "direct"
    # Transitive pins capped by the package that needs them: Dependabot still bumps them in the generated files
    # (#209 set tenacity 9.2.1, leaving every requirements*.txt uninstallable). Ignore only the versions above the
    # cap (ignore rules also apply to grouped updates). Remove an entry when its dependent lifts the cap.
    ignore:
      - dependency-name: "tenacity" # google-genai requires tenacity<9.2.0
        versions: [">=9.2.0"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflow actions in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Hook revisions in .pre-commit-config.yaml (keep ruff in sync with pyproject.toml).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
