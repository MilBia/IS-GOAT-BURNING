name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # cache dependencies

      - name: Install ffmpeg (segments-mode tests run the real binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders | grep -w mpeg4

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest
        run: |
          # PYTHONPATH=. is crucial for pytest to find the 'is_goat_burning' module
          PYTHONPATH=. pytest -rs

  requirements-in-sync:
    # #216: every requirements*.txt must equal what the pip-compile command in its own header produces from the current
    # pyproject.toml. pip-compile starts from the committed file (no upgrades), so the only differences are hand edits,
    # a stale file or an unsatisfiable pin (e.g. a Dependabot bump of a transitive dependency past its dependent's cap).
    # Needs network access to PyPI for package metadata.
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install pip and pip-tools (pip-tools version pinned in requirements-dev.txt)
        # pip is pinned too: pip-tools resolves through pip, so a new pip release must not change the check's result.
        run: pip install pip==26.3 "$(grep '^pip-tools==' requirements-dev.txt)"

      - name: Re-run pip-compile for every requirements*.txt
        run: |
          set -f  # header words are split into arguments below, never globbed or evaluated
          for f in $(git ls-files 'requirements*.txt'); do
            cmd=$(sed -n '/^#    pip-compile /{s/^#    //p;q}' "$f")  # first match only
            # Allow-list: a header must not be able to switch the check off (--dry-run, another --output-file, ...).
            set -- $cmd
            [ "${1:-}" = pip-compile ] && ok=1 || ok=0
            outs=0 srcs=0
            for a in "${@:2}"; do
              # Allow-list of pip-compile arguments; add new flags here deliberately (e.g. for pip-tools 8).
              case "$a" in
                --extra=* | --unsafe-package=*) [[ "${a#*=}" =~ ^[A-Za-z0-9._-]+$ ]] || ok=0 ;;
                "--output-file=$f") outs=$((outs + 1)) ;;
                pyproject.toml) srcs=$((srcs + 1)) ;;
                *) ok=0 ;;
              esac
            done
            if [ "$ok$outs$srcs" != 111 ]; then echo "::error file=$f::unexpected header command: '$cmd'"; exit 1; fi
            echo "$f: $cmd"
            "$@" --quiet
          done
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::pip-compile changed or created files (status and diff above): requirements*.txt are not in sync with pyproject.toml. Regenerate them as described in CONTRIBUTING.md (Dependency Updates) and commit the result."
            exit 1
          fi

  no-outbound:
    # #210: local inference must not phone home. Installs the optional edge backends the way the docs say and runs
    # tests/security (every PR, including Dependabot's), so a dependency bump that re-enables telemetry fails here
    # once requirements*.txt are regenerated.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies and optional edge backends
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -r requirements-openvino.txt
          # CPU wheel of the pinned onnxruntime-gpu version (CI only, not a project dependency)
          pip install "onnxruntime==$(sed -n 's/^onnxruntime-gpu==//p' requirements-edge-gpu.txt)"

      - name: Allow unprivileged network namespaces (unshare -rn)
        run: |
          # Ubuntu's AppArmor blocks unprivileged user namespaces by default; the test runs inference inside an empty
          # network namespace so native code cannot reach the network either.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn true && echo "unshare -rn works"

      - name: Run no-outbound security tests
        run: NO_OUTBOUND_REQUIRE_NETNS=1 PYTHONPATH=. pytest tests/security -v -rs

      - name: Check the in-code OpenVINO telemetry block (openvino-telemetry installed)
        run: |
          # requirements-openvino.txt leaves the package out; install it here so the sys.modules block itself is tested.
          # The whole pytest runs inside the empty network namespace: the leak control really emits telemetry.
          pip install --no-deps openvino-telemetry==2025.2.0
          export NO_OUTBOUND_REQUIRE_NETNS=1 NO_OUTBOUND_REQUIRE_OV_TELEMETRY=1
          PYTHONPATH=. unshare -rn pytest tests/security -v -rs -k openvino

  docker-cpu:
    # #214: build the cpu image, run the test suite inside it (no network) and check that the OpenCV version built from
    # source in the gpu/opencl stages matches the opencv-python wheel. Plain docker build: no buildx setup/cache actions.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check source-built OpenCV version matches the wheel (major.minor)
        run: |
          wheel=$(sed -n 's/^opencv-python==\([0-9]*\.[0-9]*\)\..*/\1/p' requirements-cpu.txt)
          docker=$(sed -n 's/^ARG OPENCV\(_CONTRIB\)\?_VERSION=//p' Dockerfile | cut -d. -f1,2 | sort -u)
          script=$(sed -n 's/^OPENCV\(_CONTRIB\)\?_VERSION="\(.*\)"$/\2/p' scripts/build_opencv.sh | cut -d. -f1,2 | sort -u)
          echo "wheel=$wheel Dockerfile=$docker build_opencv.sh=$script"
          if [ -z "$wheel" ] || [ "$docker" != "$wheel" ] || [ "$script" != "$wheel" ]; then
            echo "::error::OpenCV versions differ; see CONTRIBUTING.md (Dependency Updates)."
            exit 1
          fi

      - name: Build cpu-test image
        run: docker build --progress=plain --target cpu-test -t goat:cpu-test .

      - name: Run tests in the image
        run: docker run --rm --network none goat:cpu-test
