# Allow-list forward proxy for the egress-restricted deployment (#212).
# Replaces the image's default configuration entirely (no conf.d includes).

http_port 3128

# Destinations by name, from allowed-domains.txt (generate it with tools/egress_allowlist.py).
# -n: never reverse-resolve, so a CONNECT to a raw IP cannot match a name through its PTR record.
acl allowed_domains dstdomain -n "/etc/squid/allowed-domains.txt"
acl https_port port 443
acl CONNECT method CONNECT

# HTTPS tunnels (CONNECT) to port 443 of an allowed name only; no plain HTTP, no other ports.
http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_domains
http_access deny all

# Log one line per connection with the host and port only (never a path or query: webhook URLs hold tokens).
# Status TCP_DENIED/403 marks a blocked destination.
logformat egress %tl %>a %Ss/%03>Hs %rm %>rd:%>rP
# A file, not stdio:/dev/stdout: squid runs as user proxy and cannot open the container's stdout. The image's
# entrypoint tails this file into `docker compose logs proxy` (capped by the logging options in docker-compose.yml);
# the file itself grows by roughly 0.5 MB a day.
access_log daemon:/var/log/squid/access.log logformat=egress

# Plain relay: no cache, no identifying headers.
cache deny all
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 1 second
pinger_enable off
coredump_dir /var/spool/squid
